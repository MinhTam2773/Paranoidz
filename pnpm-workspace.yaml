packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  sharp: true
  unrs-resolver: true
  # posthog-js dependency; its postinstall only prints a funding banner.
  core-js: false
  # wrangler / @opennextjs/cloudflare: both postinstalls fetch their native binary.
  esbuild: true
  workerd: true
