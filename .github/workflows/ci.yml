# Unit, smoke and e2e tests on a throwaway local Supabase — never prod or paranoidz-test.
# Spec: docs/superpowers/specs/2026-10-15-e2e-ci-design.md
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      # All migrations + seeds apply from zero. Unused services skipped to start faster; Mailpit stays (S11, S12).
      - name: Start local Supabase
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor

      # Auth fetches our email templates from Kong at boot; when Kong isn't listening yet ("connection
      # refused" in its log) it sends Supabase's English defaults from then on. Restarted once the
      # stack is up, it loads ours, whose links S11 / S12 follow to /auth/confirm.
      - name: Reload auth email templates
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker restart supabase_auth_Paranoidz
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' supabase_auth_Paranoidz)" = healthy ] && break; sleep 2; done
          if docker logs --since "$since" supabase_auth_Paranoidz 2>&1 | grep templatemailer_template_body_http_error; then exit 1; fi

      # The smoke scripts read apps/admin/.env.local. The e2e tests read `supabase status` themselves.
      - name: Point the smoke scripts at local Supabase
        run: |
          supabase status -o env | awk -F= '
            /^API_URL=/ { print "NEXT_PUBLIC_SUPABASE_URL=" $2 }
            /^PUBLISHABLE_KEY=/ { print "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" $2 }
            /^SECRET_KEY=/ { print "SUPABASE_SERVICE_ROLE_KEY=" $2 }
          ' > apps/admin/.env.local

      - name: Admin unit tests
        run: pnpm --filter admin test

      - name: DB package unit tests (SPX signing, order bodies)
        run: pnpm --filter @paranoidz/db test

      - name: Smoke — orders, vouchers, security
        run: pnpm --filter @paranoidz/db smoke

      - name: Smoke — inventory
        run: pnpm --filter @paranoidz/db smoke:inventory

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Auth service log (on failure)
        if: failure()
        run: |
          docker inspect supabase_auth_Paranoidz --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E 'MAILER_(SUBJECTS|TEMPLATES)_' || true
          docker exec supabase_auth_Paranoidz wget -qO- http://supabase_kong_Paranoidz:8088/email/recovery.html | head -c 300 || true
          docker logs supabase_auth_Paranoidz --tail 80 2>&1 | grep -vE '"path":"/health"' || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
