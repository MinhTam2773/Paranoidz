# Unit, smoke and e2e tests on a throwaway local Supabase — never prod or paranoidz-test.
# Spec: docs/superpowers/specs/2026-10-15-e2e-ci-design.md
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      # All migrations + seeds apply from zero. Unused services skipped to start faster.
      - name: Start local Supabase
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor

      # The smoke scripts read apps/admin/.env.local. The e2e tests read `supabase status` themselves.
      - name: Point the smoke scripts at local Supabase
        run: |
          supabase status -o env | awk -F= '
            /^API_URL=/ { print "NEXT_PUBLIC_SUPABASE_URL=" $2 }
            /^PUBLISHABLE_KEY=/ { print "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" $2 }
            /^SECRET_KEY=/ { print "SUPABASE_SERVICE_ROLE_KEY=" $2 }
          ' > apps/admin/.env.local

      - name: Admin unit tests
        run: pnpm --filter admin test

      - name: Smoke — orders, vouchers, security
        run: pnpm --filter @paranoidz/db smoke

      - name: Smoke — inventory
        run: pnpm --filter @paranoidz/db smoke:inventory

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
